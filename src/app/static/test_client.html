<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSL API – trang test</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); background:var(--card); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  main { display:grid; grid-template-columns:minmax(320px, 1fr) minmax(300px, 420px); gap:16px; padding:16px 20px; max-width:1200px; }
  @media (max-width: 820px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  input[type=text], input[type=number] { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  input[type=number] { width:72px; }
  button { padding:7px 14px; border:1px solid var(--line); border-radius:6px; background:var(--card); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .tabs button.active { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .stage { position:relative; background:#111; border-radius:8px; overflow:hidden; aspect-ratio:4/3; }
  .stage video { width:100%; height:100%; object-fit:contain; display:block; }
  .stage video.mirror { transform:scaleX(-1); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:64px; font-weight:700; text-shadow:0 2px 8px #000; pointer-events:none; }
  .rec { position:absolute; top:10px; left:10px; background:var(--bad); color:#fff; padding:2px 8px; border-radius:4px; font-size:12px; display:none; }
  progress { width:100%; height:8px; }
  .strip { display:grid; grid-template-columns:repeat(10, 1fr); gap:3px; margin-top:10px; }
  .strip img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:3px; background:#ddd; }
  .label { font-size:30px; font-weight:700; margin:4px 0; }
  .status { font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .muted { color:var(--muted); }
  .bar { display:grid; grid-template-columns:110px 1fr 56px; gap:8px; align-items:center; margin:4px 0; }
  .bar .track { background:var(--line); border-radius:4px; height:10px; overflow:hidden; }
  .bar .fill { background:var(--accent); height:100%; }
  .bar span:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:10px 0 0; }
  dt { color:var(--muted); } dd { margin:0; font-variant-numeric:tabular-nums; }
  pre { background:#f1f3f6; padding:8px; border-radius:6px; font-size:12px; max-height:220px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  ul.history { list-style:none; padding:0; margin:0; max-height:200px; overflow:auto; }
  ul.history li { padding:4px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; }
</style>
</head>
<body>
<header>
  <h1>VSL API – trang test</h1>
  <label>Server <input id="server" type="text" size="28"></label>
  <button id="healthBtn">Kiểm tra kết nối</button>
  <span id="healthStatus" class="muted">chưa kết nối</span>
</header>

<main>
  <section class="card">
    <div class="row tabs">
      <button id="tabCam" class="active">Webcam</button>
      <button id="tabFile">File video</button>
      <input id="fileInput" type="file" accept="video/*" hidden>
    </div>

    <div class="stage">
      <video id="video" playsinline muted class="mirror"></video>
      <div id="overlay" class="overlay"></div>
      <div id="rec" class="rec">● REC</div>
    </div>

    <div class="row" style="margin-top:10px">
      <label>Số frame <input id="nFrames" type="number" min="1" value="30"></label>
      <label>FPS <input id="fps" type="number" min="1" max="60" step="1" value="15"></label>
      <label>Đếm ngược <input id="countdown" type="number" min="0" max="10" value="2"> s</label>
      <label>Cạnh dài <input id="maxSide" type="number" min="160" max="1280" step="80" value="1280"> px</label>
    </div>
    <div class="row">
      <label><input id="mirrorData" type="checkbox"> mirror_data</label>
      <label><input id="mirrorPreview" type="checkbox" checked> lật preview</label>
      <label>top_k <input id="topK" type="number" min="1" max="10" value="3"></label>
    </div>
    <div class="row">
      <button id="startCam">Bật camera</button>
      <button id="captureBtn" class="primary" disabled>Ghi &amp; dự đoán</button>
      <button id="loopBtn" disabled>Liên tục: tắt</button>
    </div>
    <progress id="progress" value="0" max="30"></progress>
    <div id="strip" class="strip"></div>
  </section>

  <section style="display:flex; flex-direction:column; gap:16px">
    <div class="card">
      <h2>Kết quả</h2>
      <div id="resultStatus" class="muted">Chưa có dự đoán</div>
      <div id="resultLabel" class="label">—</div>
      <div id="bars"></div>
      <dl id="meta"></dl>
    </div>
    <div class="card">
      <h2>Lịch sử</h2>
      <ul id="history" class="history"></ul>
    </div>
    <div class="card">
      <h2>Response JSON</h2>
      <pre id="raw">—</pre>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const video = $("video");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
let mode = "cam";          // "cam" | "file"
let stream = null;
let busy = false;
let looping = false;

$("server").value = location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000";
const api = (path) => $("server").value.replace(/\/+$/, "") + path;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------- kết nối ----------
async function checkHealth() {
  const el = $("healthStatus");
  el.className = "muted"; el.textContent = "đang kiểm tra…";
  try {
    const res = await fetch(api("/api/health"));
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.status);
    if (body.expected_frames) $("nFrames").value = body.expected_frames;
    el.className = "ok";
    el.textContent = `OK · ${body.classes.length} lớp · cần ${body.expected_frames ?? "bất kỳ"} frame`;
    el.title = body.classes.join(", ") + "\n" + body.checkpoint;
  } catch (err) {
    el.className = "bad"; el.textContent = "Lỗi: " + err.message;
  }
}

// ---------- nguồn video ----------
function setMode(next) {
  mode = next;
  $("tabCam").classList.toggle("active", mode === "cam");
  $("tabFile").classList.toggle("active", mode === "file");
  $("startCam").hidden = mode !== "cam";
  $("loopBtn").hidden = mode !== "cam";
  $("countdown").parentElement.hidden = mode !== "cam";
  if (mode === "file") {
    stopCamera();
    video.classList.remove("mirror");
    $("fileInput").click();
  } else {
    video.removeAttribute("src"); video.load();
    video.classList.toggle("mirror", $("mirrorPreview").checked);
    $("captureBtn").disabled = true;
  }
}

async function startCamera() {
  try {
    // Xin độ phân giải 16:9 lớn nhất (trình duyệt chọn chế độ gốc gần nhất); ô "maxSide" thu nhỏ khi gửi.
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 3840 }, height: { ideal: 2160 }, aspectRatio: { ideal: 16 / 9 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    console.log(`Camera: ${video.videoWidth}x${video.videoHeight}`);
    $("captureBtn").disabled = false;
    $("loopBtn").disabled = false;
    $("startCam").textContent = "Tắt camera";
  } catch (err) {
    showError("Không mở được camera: " + err.message);
  }
}

function stopCamera() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
  video.srcObject = null;
  looping = false;
  $("loopBtn").textContent = "Liên tục: tắt";
  $("loopBtn").disabled = true;
  $("startCam").textContent = "Bật camera";
}

$("fileInput").addEventListener("change", () => {
  const file = $("fileInput").files[0];
  if (!file) return;
  video.srcObject = null;
  video.src = URL.createObjectURL(file);
  video.onloadedmetadata = () => { $("captureBtn").disabled = false; video.currentTime = 0; };
  video.onerror = () => {
    $("captureBtn").disabled = true;
    showError("Trình duyệt không phát được video này (video ghi bằng OpenCV dùng codec mp4v; " +
              "chuyển sang H.264: ffmpeg -i in.mp4 -c:v libx264 -pix_fmt yuv420p out.mp4)");
  };
});

// ---------- chụp frame ----------
function grab() {
  // Gửi frame gốc (không lật); server tự lật nếu mirror_data = true.
  const w = video.videoWidth, h = video.videoHeight;
  const scale = Math.min(1, Number($("maxSide").value) / Math.max(w, h));
  canvas.width = Math.round(w * scale);
  canvas.height = Math.round(h * scale);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL("image/jpeg", 0.85);
}

async function captureCamera(n, fps) {
  for (let s = Number($("countdown").value); s > 0 && !$("countdown").parentElement.hidden; s--) {
    $("overlay").textContent = s;
    await sleep(1000);
  }
  $("overlay").textContent = "";
  $("rec").style.display = "block";
  const frames = [];
  const start = performance.now();
  for (let i = 0; i < n; i++) {
    const wait = start + (i * 1000) / fps - performance.now();
    if (wait > 0) await sleep(wait);
    frames.push(grab());
    onFrame(frames, n);
  }
  $("rec").style.display = "none";
  return { frames, fps };
}

async function captureFile(n) {
  // Lấy n frame đều trên cả video; fps gửi server = n / thời lượng (giống lấy mẫu lại clip).
  video.pause();
  const duration = video.duration;
  if (!isFinite(duration) || duration <= 0) throw new Error("Không đọc được thời lượng video");
  const frames = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0 : (i * (duration - 1e-3)) / (n - 1);
    await new Promise((resolve) => { video.onseeked = resolve; video.currentTime = t; });
    frames.push(grab());
    onFrame(frames, n);
  }
  return { frames, fps: Math.min(240, n / duration) };
}

function onFrame(frames, n) {
  $("progress").max = n;
  $("progress").value = frames.length;
  const img = document.createElement("img");
  img.src = frames[frames.length - 1];
  $("strip").appendChild(img);
}

// ---------- gọi API ----------
async function captureAndPredict() {
  if (busy) return;
  busy = true;
  $("captureBtn").disabled = true;
  $("strip").innerHTML = "";
  try {
    const n = Number($("nFrames").value);
    const { frames, fps } = mode === "cam" ? await captureCamera(n, Number($("fps").value)) : await captureFile(n);
    $("resultStatus").className = "muted";
    $("resultStatus").textContent = `Đang gửi ${frames.length} frame…`;
    const t0 = performance.now();
    const res = await fetch(api("/api/predict"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        frames, fps,
        mirror_data: $("mirrorData").checked,
        top_k: Number($("topK").value),
      }),
    });
    const body = await res.json();
    $("raw").textContent = JSON.stringify(body, null, 2);
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    showResult(body, performance.now() - t0, fps);
  } catch (err) {
    showError(err.message);
  } finally {
    busy = false;
    $("captureBtn").disabled = false;
  }
}

function showResult(r, roundTripMs, fps) {
  const status = $("resultStatus");
  if (r.accepted) { status.className = "status ok"; status.textContent = "Chấp nhận"; }
  else {
    status.className = "status warn";
    status.textContent = r.rejection_reason === "ambiguous" ? "Từ chối: không rõ ràng (2 lớp quá gần)" : "Từ chối: độ tin cậy thấp";
  }
  $("resultLabel").textContent = r.label ?? (r.top[0] ? `(${r.top[0].label}?)` : "—");
  $("resultLabel").className = "label" + (r.accepted ? "" : " muted");
  $("bars").innerHTML = r.top.map((t) => `
    <div class="bar"><span>${escapeHtml(t.label)}</span>
      <div class="track"><div class="fill" style="width:${(t.confidence * 100).toFixed(1)}%"></div></div>
      <span>${(t.confidence * 100).toFixed(1)}%</span></div>`).join("");
  $("meta").innerHTML = `
    <dt>confidence</dt><dd>${r.confidence.toFixed(3)}</dd>
    <dt>probability_gap</dt><dd>${r.probability_gap.toFixed(3)}</dd>
    <dt>frames · fps</dt><dd>${r.frames} · ${fps.toFixed(1)}</dd>
    <dt>server</dt><dd>${r.elapsed_ms} ms</dd>
    <dt>round-trip</dt><dd>${Math.round(roundTripMs)} ms</dd>`;
  const li = document.createElement("li");
  li.innerHTML = `<span class="${r.accepted ? "ok" : "muted"}">${escapeHtml(r.label ?? "— " + r.rejection_reason)}</span>
                  <span class="muted">${(r.confidence * 100).toFixed(0)}% · ${new Date().toLocaleTimeString()}</span>`;
  $("history").prepend(li);
}

function showError(message) {
  $("resultStatus").className = "status bad";
  $("resultStatus").textContent = "Lỗi: " + message;
  $("resultLabel").textContent = "—";
  $("bars").innerHTML = "";
  $("meta").innerHTML = "";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loop() {
  while (looping && stream) {
    await captureAndPredict();
    await sleep(300);
  }
}

// ---------- sự kiện ----------
$("healthBtn").onclick = checkHealth;
$("tabCam").onclick = () => setMode("cam");
$("tabFile").onclick = () => setMode("file");
$("startCam").onclick = () => (stream ? stopCamera() : startCamera());
$("captureBtn").onclick = captureAndPredict;
$("loopBtn").onclick = () => {
  looping = !looping;
  $("loopBtn").textContent = "Liên tục: " + (looping ? "bật" : "tắt");
  $("countdown").parentElement.hidden = looping;   // chế độ liên tục bỏ đếm ngược
  if (looping) loop();
};
$("mirrorPreview").onchange = () => video.classList.toggle("mirror", mode === "cam" && $("mirrorPreview").checked);
checkHealth();
</script>
</body>
</html>
